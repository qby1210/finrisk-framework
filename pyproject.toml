[project]
name = "finrisk-framework"
version = "0.1.0"
description = "金融风险识别合作项目的后端字段契约与目录骨架"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2.0",
    "ruff>=0.9,<1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/domain"]